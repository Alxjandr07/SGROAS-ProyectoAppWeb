name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: sgroas_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw scripts/validate-traceability.sh scripts/audit-sql-dynamic.sh

      - name: Validate traceability matrix
        run: scripts/validate-traceability.sh

      - name: Audit SQL dynamic construction
        run: scripts/audit-sql-dynamic.sh

      - name: Install redis-cli
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432; do sleep 2; done
          until redis-cli -h localhost ping; do sleep 2; done

      - name: Build and test
        run: ./mvnw clean verify --batch-mode
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sgroas_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Generate versions artifact (make versions)
        run: make versions

      - name: Upload versions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions-txt
          path: docs/entorno/versions.txt

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sgroas-jar
          path: target/*.jar

  docker-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alxjandr07/sgroas:${{ github.ref_name }}
            ghcr.io/alxjandr07/sgroas:latest

      - name: Print image digest
        run: echo "image pushed: ghcr.io/alxjandr07/sgroas:${{ github.ref_name }} digest=${{ steps.build.outputs.digest }}"
