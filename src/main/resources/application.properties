spring.application.name=sgroas

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/sgroas_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# ===============================
# JWT
# ===============================
app.jwt.secret=SGROAS_SECRET_KEY_DE_DESARROLLO_2026_ENTREGA_1B_CON_MINIMO_32_CARACTERES
app.jwt.expiration-ms=3600000
app.jwt.issuer=https://sgroas.uteq.edu.ec
app.jwt.audience=sgroas-frontend

# ===============================
# Cache
# ===============================
app.cache.default-ttl=300

# ===============================
# OpenAPI / SpringDoc
# ===============================
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
springdoc.show-actuator=false

# ===============================
# Actuator (health checks de despliegue)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ===============================
# REDIS
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# REFRESH TOKEN
# ===============================
app.jwt.refresh-expiration-ms=604800000

# ===============================
# Logging
# ===============================
logging.level.ec.edu.uteq.sgroas.security.JwtAuthenticationFilter=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n