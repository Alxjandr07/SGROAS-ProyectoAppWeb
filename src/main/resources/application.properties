spring.application.name=sgroas

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/sgroas_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# En produccion desactivamos el volcado de SQL al log: acelera el arranque y
# reduce el I/O de logs durante el despliegue (Relevant - fixes timeout Render).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Servidor
server.port=8080

# ===============================
# JWT
# ===============================
app.jwt.secret=SGROAS_SECRET_KEY_DE_DESARROLLO_2026_ENTREGA_1B_CON_MINIMO_32_CARACTERES
app.jwt.expiration-ms=3600000
app.jwt.issuer=https://sgroas.uteq.edu.ec
app.jwt.audience=sgroas-frontend

# Cookie del token: en desarrollo (HTTP) debe ser false para que el navegador
# la guarde; en produccion (HTTPS) cambiar a true.
app.cookie.secure=false

# ===============================
# Cache
# ===============================
app.cache.default-ttl=300

# ===============================
# OpenAPI / SpringDoc
# ===============================
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/docs/swagger-ui.html
springdoc.show-actuator=false

# ===============================
# Actuator (health checks de despliegue)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
# El health base (/actuator/health que usa Render) reporta UP solo cuando la
# app esta lista y las dependencias criticas (db y redis) estan conectadas.
# Esto evita que Render marque "no open ports" prematuramente.
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState

# ===============================
# REDIS
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# REFRESH TOKEN
# ===============================
app.jwt.refresh-expiration-ms=604800000

# ===============================
# CORREO (SMTP) - codigos de verificacion y restablecimiento
# Si SMTP_HOST esta vacio funciona en MODO CONSOLA (el codigo queda en el log)
# Ejemplo Gmail: SMTP_HOST=smtp.gmail.com, SMTP_USER=tucorreo@gmail.com, SMTP_PASS=clave-de-aplicacion
# ===============================
app.smtp.host=${SMTP_HOST:}
app.smtp.port=${SMTP_PORT:587}
app.smtp.username=${SMTP_USER:}
app.smtp.password=${SMTP_PASS:}
app.mail.from=${MAIL_FROM:no-reply@sgroas.com}

# ===============================
# Logging
# ===============================
logging.level.ec.edu.uteq.sgroas.security.JwtAuthenticationFilter=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n